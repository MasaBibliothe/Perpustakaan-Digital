<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novel Collection | MASA BIBLIOTHÉ</title>

<style>
body{
font-family:Poppins,sans-serif;
background:#f8f4ea;
margin:0;
padding:40px;
}

h1{
text-align:center;
color:#e7584b;
margin-bottom:50px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.content{
padding:20px;
}

.content h3{
color:#7a834f;
}

button{
margin-top:15px;
padding:10px 20px;
border:none;
background:#ff8db0;
color:white;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>Novel Collection</h1>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1541963463532-d68292c34b19?q=80&w=1200&auto=format&fit=crop">

<div class="content">
<h3>Historical Novel</h3>
<p>Kumpulan novel yang mengandung sejarah.</p>
<button>Read Novel</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=1200&auto=format&fit=crop">

<div class="content">
<h3>Fantasy Novel</h3>
<p>Petualangan fantasi dan dunia imajinasi.</p>
<button>Open Book</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?q=80&w=1200&auto=format&fit=crop">

<div class="content">
<h3>Mystery Novel</h3>
<p>Koleksi novel misteri dan thriller terbaik.</p>
<button>Explore</button>
</div>
</div>

</div>

</body>
</html>
