<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuskrip Kuno Indonesia | MASA BIBLIOTHÉ</title>

<style>
body{
font-family:Poppins,sans-serif;
background:#f8f4ea;
margin:0;
padding:40px;
}

h1{
text-align:center;
color:#e7584b;
margin-bottom:50px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.content{
padding:20px;
}

.content h3{
color:#7a834f;
margin-bottom:10px;
}

button{
margin-top:15px;
padding:10px 20px;
border:none;
background:#ff8db0;
color:white;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<h1> Manuskrip Kuno Indonesia</h1>

<div class="cards">

<div class="card">
<img  id="imgManuskripKunoIndonesiaCollection" src="naskah.jpg">

<div class="content">
<h3>Naskah Jawa kuno</h3>
<p>Koleksi manuskrip dan aksara Jawa Kuno digital.</p>

<button>Open Manuscript</button>
</div>
</div>

<div class="card">
<img  id="imgManuskripKunoIndonesiaCollection" src="lontarbali.jpg">

<div class="content">
<h3>Lontar Bali</h3>
<p>Naskah lontar Bali berisi sejarah dan budaya tradisional.</p>

<button>Read Archive</button>
</div>
</div>

<div class="card">
<img  id="imgManuskripKunoIndonesiaCollection" src="arsipnusantara.jpg">

<div class="content">
<h3>Arsip Nusantara</h3>

<button>Explore</button>
</div>
</div>

</div>

</body>
</html>
